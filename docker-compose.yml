name: wecom-dinner-agent

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wecom_dinner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wecom_dinner}
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        uvicorn app.main:app --app-dir src --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-wecom_dinner}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DIFY_CLIENT_MODE: ${DIFY_CLIENT_MODE:-mock}
      DIFY_API_BASE: ${DIFY_API_BASE:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      WECOM_SENDER_MODE: ${WECOM_SENDER_MODE:-mock}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      WECOM_API_BASE: ${WECOM_API_BASE:-https://qyapi.weixin.qq.com}
      WECOM_SENDER_TIMEOUT_SECONDS: ${WECOM_SENDER_TIMEOUT_SECONDS:-10}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_APP_SECRET: ${WECOM_APP_SECRET:-}
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
      WECOM_ENCODING_AES_KEY: ${WECOM_ENCODING_AES_KEY:-}
      WECOM_CALLBACK_MAX_AGE_SECONDS: ${WECOM_CALLBACK_MAX_AGE_SECONDS:-300}
      REMINDER_SCHEDULER_ENABLED: ${REMINDER_SCHEDULER_ENABLED:-true}
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
