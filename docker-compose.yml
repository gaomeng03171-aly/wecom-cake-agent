name: wecom-cake-agent

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wecom_cake}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wecom_cake}
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    command:
      - sh
      - -c
      - >
        alembic upgrade head &&
        uvicorn app.main:app --app-dir src --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AGENT_SCENARIO: ${AGENT_SCENARIO:-order}
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-wecom_cake}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DIFY_CLIENT_MODE: ${DIFY_CLIENT_MODE:-mock}
      DIFY_API_BASE: ${DIFY_API_BASE:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      ORDER_DIFY_MODE: ${ORDER_DIFY_MODE:-auto}
      DIFY_ORDER_API_BASE: ${DIFY_ORDER_API_BASE:-}
      DIFY_ORDER_API_KEY: ${DIFY_ORDER_API_KEY:-}
      DIFY_ORDER_USER: ${DIFY_ORDER_USER:-wecom-order-agent}
      DIFY_ORDER_TIMEOUT_SECONDS: ${DIFY_ORDER_TIMEOUT_SECONDS:-30}
      WECOM_SENDER_MODE: ${WECOM_SENDER_MODE:-mock}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      WECOM_API_BASE: ${WECOM_API_BASE:-https://qyapi.weixin.qq.com}
      WECOM_SENDER_TIMEOUT_SECONDS: ${WECOM_SENDER_TIMEOUT_SECONDS:-10}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_APP_SECRET: ${WECOM_APP_SECRET:-}
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
      WECOM_ENCODING_AES_KEY: ${WECOM_ENCODING_AES_KEY:-}
      WECOM_CALLBACK_MAX_AGE_SECONDS: ${WECOM_CALLBACK_MAX_AGE_SECONDS:-300}
      WECOM_AIBOT_ID: ${WECOM_AIBOT_ID:-}
      WECOM_AIBOT_SECRET: ${WECOM_AIBOT_SECRET:-}
      WECOM_AIBOT_WS_URL: ${WECOM_AIBOT_WS_URL:-}
      WECOM_AIBOT_NAME: ${WECOM_AIBOT_NAME:-}
      WECOM_AIBOT_REQUIRE_MENTION: ${WECOM_AIBOT_REQUIRE_MENTION:-true}
      WECOM_OWNER_USER_ID: ${WECOM_OWNER_USER_ID:-}
      REMINDER_SCHEDULER_ENABLED: ${REMINDER_SCHEDULER_ENABLED:-true}
      REMINDER_POLL_SECONDS: ${REMINDER_POLL_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/admin-web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app

  aibot-worker:
    build: .
    profiles:
      - aibot
    command:
      - python
      - scripts/run_wecom_aibot_worker.py
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      AGENT_SCENARIO: ${AGENT_SCENARIO:-order}
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-wecom_cake}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DIFY_CLIENT_MODE: ${DIFY_CLIENT_MODE:-mock}
      DIFY_API_BASE: ${DIFY_API_BASE:-}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      ORDER_DIFY_MODE: ${ORDER_DIFY_MODE:-auto}
      DIFY_ORDER_API_BASE: ${DIFY_ORDER_API_BASE:-}
      DIFY_ORDER_API_KEY: ${DIFY_ORDER_API_KEY:-}
      DIFY_ORDER_USER: ${DIFY_ORDER_USER:-wecom-order-agent}
      DIFY_ORDER_TIMEOUT_SECONDS: ${DIFY_ORDER_TIMEOUT_SECONDS:-30}
      WECOM_AIBOT_ID: ${WECOM_AIBOT_ID:-}
      WECOM_AIBOT_SECRET: ${WECOM_AIBOT_SECRET:-}
      WECOM_AIBOT_WS_URL: ${WECOM_AIBOT_WS_URL:-}
      WECOM_AIBOT_NAME: ${WECOM_AIBOT_NAME:-}
      WECOM_AIBOT_REQUIRE_MENTION: ${WECOM_AIBOT_REQUIRE_MENTION:-true}
      WECOM_OWNER_USER_ID: ${WECOM_OWNER_USER_ID:-}
      WECOM_SENDER_MODE: aibot_ws
      REMINDER_SCHEDULER_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
