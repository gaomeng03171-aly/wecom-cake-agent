[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-cake-agent"
version = "1.5.0"
description = "A WeCom group dinner organizer agent for learning agent project development."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "cryptography>=45,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
    "wecom-aibot-sdk==1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
